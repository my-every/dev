name: windows-release-ev

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release-ev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sign-release:
    # Self-hosted runner where EV token middleware is installed
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 60
    environment: release
    # Skip the job entirely when no EV signing identity is configured.
    # At least one of WINDOWS_CSC_NAME or WINDOWS_CSC_SHA1 must be set.
    if: ${{ secrets.WINDOWS_CSC_NAME != '' || secrets.WINDOWS_CSC_SHA1 != '' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Use cert from Windows cert store by subject name (set as secret to avoid hardcoding)
      CSC_NAME: ${{ secrets.WINDOWS_CSC_NAME }}
      # electron-builder expects CSC_KEY_PASSWORD for token/provider PIN when required
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      # Optional thumbprint pinning if multiple certs exist in cert store
      CSC_SHA1: ${{ secrets.WINDOWS_CSC_SHA1 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate signing identity
        shell: pwsh
        run: |
          # Belt-and-suspenders check; job-level `if` already gates on secrets.
          Write-Host "CSC_NAME  : $env:CSC_NAME"
          Write-Host "CSC_SHA1  : $env:CSC_SHA1"
          Write-Host "PIN set   : $(-not [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD))"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and sign Windows installer (EV cert store)
        run: pnpm dist:win

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $files = Get-ChildItem release -Recurse -Include *.exe,*.msi | Where-Object { $_.FullName -notmatch "win-unpacked" }
          if (-not $files) { throw "No signed installer artifacts found." }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status) / $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne "Valid") { throw "Invalid signature on $($f.FullName)" }
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-ev
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml