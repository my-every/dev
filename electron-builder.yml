appId: com.myevery.d380
productName: D380
executableName: D380
directories:
  output: release
files:
  - dist-electron/**
  - package.json
npmRebuild: false
asar: true
extraResources:
  - from: .next/standalone
    to: next-standalone
    filter:
      - "**/*"
      - "node_modules/**"
      - "node_modules/.pnpm/**"
      - ".next/**"
      - "!node_modules/electron"
      - "!node_modules/electron/**"
      - "!node_modules/.pnpm/electron@*"
      - "!node_modules/.pnpm/electron@*/**"
      - "!release"
      - "!release/**"
  - from: .next/standalone/node_modules
    to: next-standalone/node_modules
    filter:
      - "**/*"
      - ".pnpm/**"
      - "!electron"
      - "!electron/**"
      - "!.pnpm/electron@*"
      - "!.pnpm/electron@*/**"
  - from: .next/static
    to: next-standalone/.next/static
  - from: public
    to: next-standalone/public
  - from: Share
    to: next-standalone/Share
    filter:
      - "**/*"
      - "!Legal Drawings"
      - "!Legal Drawings/**"
      - "!Brand Lists"
      - "!Brand Lists/**"
win:
  icon: public/windows/icon.ico
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  artifactName: ${productName}-Setup-${version}.${ext}
mac:
  icon: public/macos/icon.icns
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
linux:
  icon: public/linux/icons
  target:
    - AppImage
    - deb
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: D380