appId: com.myevery.d380
productName: D380

# Fails build if signing cannot be completed
forceCodeSigning: true

win:
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker
  signingHashAlgorithms:
    - sha256
  verifyUpdateCodeSignature: true
  artifactName: ${productName}-Setup-${version}.${ext}

  # Publisher display name shown in SmartScreen/UAC
  # Must exactly match cert subject (or one of chain publisher names)
  publisherName:
    - MyEvery, Inc.

  signtoolOptions:
    # Legacy timestamp
    timeStampServer: http://timestamp.digicert.com
    # RFC3161 timestamp
    rfc3161TimeStampServer: http://timestamp.digicert.com
    # Optional hard pin if you use cert from Windows cert store
    # certificateSha1: YOUR_CERT_THUMBPRINT

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: D380